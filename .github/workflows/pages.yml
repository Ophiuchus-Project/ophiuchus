# Deploys site/ to GitHub Pages. Runs only in the PUBLIC repository Ophiuchus-Project/ophiuchus, on each push the
# private repository's publish workflow makes to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'Ophiuchus-Project/ophiuchus'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - name: Only the page and its data are deployed
        run: |
          set -euo pipefail
          test -f site/index.html && test -f site/data/index.json && test -f site/gate-stamp.json
          mkdir _site && cp -r site/. _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
